name: estate_registry
description: "Estate Registry — property allotment and rent collection app (PocketBase-backed, LAN only)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  pocketbase: ^0.22.0
  http: ^1.2.2

  # State management
  provider: ^6.1.2

  # Local, on-device settings only
  shared_preferences: ^2.3.2

  # Camera capture for challan photos
  image_picker: ^1.1.2

  # Monthly rent report export
  csv: ^6.0.0
  share_plus: ^11.0.0
  path_provider: ^2.1.4

  # Date formatting
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/icon_foreground.png

# Flutter Launcher Icons
flutter_launcher_icons:
  android: true
  ios: true

  # iOS icon
  image_path: "assets/logo.png"

  # Android adaptive icon
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_foreground.png"

  min_sdk_android: 21
  remove_alpha_ios: true